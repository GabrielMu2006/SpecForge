<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的收藏 · 私人藏品目录</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e7;
      --surface: #fffdf8;
      --ink: #292b25;
      --muted: #626256;
      --accent: #77513a;
      --line: #d6cdbd;
      --focus: #254e44;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button { font: inherit; }
    button:focus-visible, [tabindex="-1"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 5px;
    }
    .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; }
    .page { width: min(100% - 96px, 1184px); margin-inline: auto; }
    .masthead { padding-block: 30px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: .875rem; letter-spacing: .15em; }
    .brand-mark { width: 21px; height: 26px; border: 1px solid var(--accent); position: relative; }
    .brand-mark::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--accent); }
    .intro { padding-block: 68px 42px; max-width: 42rem; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 600; letter-spacing: .16em; margin: 0 0 16px; }
    h1 { font-size: clamp(2.25rem, 5vw, 3.5rem); line-height: 1.3; font-weight: 500; margin: 0; }
    .intro p:last-child { margin: 18px 0 0; color: var(--muted); line-height: 1.8; }
    .collection { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 24px; padding-bottom: 72px; }
    .piece { display: flex; flex-direction: column; min-width: 0; padding: 28px; background: var(--surface); border: 1px solid var(--line); }
    .piece-number { color: var(--accent); font-size: .75rem; letter-spacing: .12em; margin: 0 0 28px; }
    .piece h2 { margin: 0; font-weight: 500; font-size: 1.5rem; line-height: 1.55; overflow-wrap: anywhere; }
    .summary { margin: 16px 0 30px; color: var(--muted); line-height: 1.8; overflow-wrap: anywhere; }
    .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .piece h2 { -webkit-line-clamp: 2; line-clamp: 2; }
    .summary { -webkit-line-clamp: 3; line-clamp: 3; }
    .piece-action { border-top: 1px solid var(--line); margin-top: auto; padding-top: 15px; }
    .text-button { display: inline-flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 44px; border: 0; background: transparent; padding: 6px 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 5px; }
    .piece .text-button { width: 100%; }
    .text-button:hover { color: var(--ink); }
    .text-button:active { transform: translateY(1px); }
    .arrow { text-decoration: none; }
    .empty { padding: 56px 28px; border-block: 1px solid var(--line); text-align: center; margin-bottom: 72px; }
    .empty h2 { margin: 0 0 14px; font-size: 1.75rem; font-weight: 500; }
    .empty p { color: var(--muted); margin: 0; line-height: 1.8; }
    .detail { padding-block: 36px 80px; }
    .detail-body { max-width: 40rem; margin: 44px auto 0; }
    .detail h1 { font-size: clamp(2rem, 4vw, 3rem); overflow-wrap: anywhere; }
    .detail-description { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 28px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { padding-block: 22px 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; letter-spacing: .1em; }
    @media (max-width: 699px) {
      .page { width: calc(100% - 40px); }
      .masthead { padding-block: 22px; }
      .intro { padding-block: 42px 28px; }
      .collection { gap: 20px; padding-bottom: 48px; }
      .piece { padding: 24px; }
      .piece-number { margin-bottom: 22px; }
      .detail { padding-top: 22px; }
      .detail-body { margin-top: 32px; }
    }
  </style>
</head>
<body>
  <header class="masthead page">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>私人藏品目录</div>
  </header>
  <main class="page">
    <section id="list-view" aria-labelledby="list-title">
      <div class="intro">
        <p class="eyebrow">收藏 · 留存与记忆</p>
        <h1 id="list-title" class="serif">我的收藏</h1>
        <p>一件藏品，一段值得留存的故事。打开展签，慢慢阅读。</p>
      </div>
      <div id="collection" class="collection"></div>
      <div id="empty" class="empty" hidden>
        <h2 class="serif">还没有藏品</h2>
        <p>藏品将陈列在这里，供你随时翻阅。</p>
      </div>
    </section>
    <section id="detail-view" class="detail" aria-labelledby="detail-title" hidden>
      <button id="back" class="text-button" type="button"><span aria-hidden="true">←</span>返回收藏</button>
      <article class="detail-body">
        <p class="eyebrow">藏品展签</p>
        <h1 id="detail-title" class="serif" tabindex="-1"></h1>
        <div id="detail-description" class="detail-description"></div>
      </article>
    </section>
    <noscript><p>请启用 JavaScript，以浏览藏品和阅读详情。</p></noscript>
  </main>
  <footer class="page">珍藏于此，随时重读。</footer>
  <script id="collection-data" type="application/json">
    [{"id":"item-001","title":"一件需要较长标题才能说明来历的藏品","description":""}]
  </script>
  <script>
    (() => {
      const items = JSON.parse(document.getElementById('collection-data').textContent);
      const listView = document.getElementById('list-view');
      const detailView = document.getElementById('detail-view');
      const collection = document.getElementById('collection');
      const title = document.getElementById('detail-title');
      const description = document.getElementById('detail-description');
      history.scrollRestoration = 'manual';

      items.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'piece';
        const number = document.createElement('p');
        number.className = 'piece-number';
        number.textContent = String(index + 1).padStart(2, '0');
        number.setAttribute('aria-hidden', 'true');
        const heading = document.createElement('h2');
        heading.className = 'serif clamp';
        heading.textContent = item.title;
        const summary = document.createElement('p');
        summary.className = 'summary clamp';
        summary.textContent = item.description || '暂无说明';
        const action = document.createElement('div');
        action.className = 'piece-action';
        const button = document.createElement('button');
        button.className = 'text-button';
        button.type = 'button';
        button.id = 'view-' + item.id;
        button.setAttribute('aria-label', '查看藏品：' + item.title);
        button.append(document.createTextNode('查看藏品'));
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '↗';
        button.append(arrow);
        button.addEventListener('click', () => {
          history.replaceState({ scrollY: window.scrollY, entryId: button.id }, '', location.href);
          history.pushState({ fromCollection: true }, '', '#collection/' + encodeURIComponent(item.id));
          renderRoute();
        });
        action.append(button);
        card.append(number, heading, summary, action);
        collection.append(card);
      });
      collection.hidden = items.length === 0;
      document.getElementById('empty').hidden = items.length !== 0;

      function renderRoute() {
        const item = items.find(entry => '#collection/' + encodeURIComponent(entry.id) === location.hash);
        listView.hidden = Boolean(item);
        detailView.hidden = !item;
        if (item) {
          title.textContent = item.title;
          description.textContent = item.description || '暂无说明';
          document.title = item.title + ' · 我的收藏';
          window.scrollTo(0, 0);
          title.focus({ preventScroll: true });
        } else {
          document.title = '我的收藏 · 私人藏品目录';
          const saved = history.state;
          window.scrollTo(0, saved?.scrollY || 0);
          if (saved?.entryId) document.getElementById(saved.entryId)?.focus({ preventScroll: true });
        }
      }
      document.getElementById('back').addEventListener('click', () => {
        if (history.state?.fromCollection) history.back();
        else {
          history.replaceState({}, '', location.pathname + location.search);
          renderRoute();
        }
      });
      window.addEventListener('popstate', renderRoute);
      window.addEventListener('hashchange', renderRoute);
      renderRoute();
    })();
  </script>
</body>
</html>
